# Applications owned by their own repositories, bootstrapped by apps/sync.sh
# when they are not running in the cluster. Nothing from these repos is copied
# here -- the URL points straight at the overlay in the project repo, and
# `kubectl apply -k <url>` fetches and renders it on the fly.
#
# These are deliberately NOT resources of the root kustomization.yaml:
# `kubectl apply -k .` must never touch them, because each project's CI owns
# the running state (image tags are set with `kustomize edit set image` at
# deploy time and never committed), and an unconditional re-apply from here
# would roll images back to whatever tag the project repo has committed.
#
# Fields (whitespace-separated):
#   name        label used in logs only
#   namespace   where the marker lives
#   marker      <kind>/<name>; if it exists, the app is considered running
#               and is left alone
#   url         kustomize target, anything `kubectl apply -k` accepts
#
# Mind the `ref=`: it is the branch each project actually deploys from, not a
# convention. PetApp's default branch is `develop`, the others' is `master`.
#
# name              namespace          marker                                url
cooknco             cooknco            deployment/cooknco-backend            https://github.com/XavierClavel/Cooknco//k8s/overlays/prod?ref=master
cooknco-topics      kafka              kafkatopic/cooknco-users              https://github.com/XavierClavel/Cooknco//k8s/kafka-topics?ref=master
expenses-tracker    expenses-tracker   deployment/expenses-tracker-backend   https://github.com/XavierClavel/expenses-tracker//k8s/overlays/prod?ref=master
padel-manager       padel              deployment/padel-backend              https://github.com/XavierClavel/padel-manager//k8s/overlays/prod?ref=master
petsradar           petsradar          deployment/petsradar-backend          https://github.com/mikhailpgrl/PetApp//k8s/overlays/prod?ref=develop
